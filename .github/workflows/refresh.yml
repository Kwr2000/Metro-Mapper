# Monthly data refresh (P1-09). Runs the adapters that are due (monthly layers each month,
# annual layers about once a year; gated adapters never), each within its approved call
# budget in config/budgets.yaml. Then it writes the validation report and publishes only if
# every hard check passes; otherwise the previous month's data stays live. The run log and
# report are committed every run, which keeps this schedule alive (GitHub disables scheduled
# workflows after 60 days without repository activity).
# Changing the schedule or a budget needs the owner's written approval (AGENTS.md).
name: Monthly refresh
on:
  schedule:
    - cron: "15 9 3 * *"   # 09:15 UTC on the 3rd of every month
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list what is due and validate; no source calls, no commit"
        type: boolean
        default: true

permissions:
  contents: write   # commit the run log, report and stored data to main
  actions: write    # start the site deploy (a push by this workflow does not trigger it)

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - name: Refresh due adapters and validate
        id: refresh
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FBI_API_KEY: ${{ secrets.FBI_API_KEY }}
        run: |
          set +e
          if [ "$DRY_RUN" = "true" ]; then
            mm refresh --dry-run --report probe-out/report.md
          else
            mm refresh --mode live --report probe-out/report.md
          fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Report (run page)
        if: always()
        run: |
          [ -f probe-out/report.md ] && cat probe-out/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report written." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit run log, report and stored data
        if: env.DRY_RUN != 'true'
        id: commit
        run: |
          git config user.name "metro-mapper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs/ingestion_runs.jsonl data/validation
          [ -d data/canonical ] && git add data/canonical
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Monthly refresh $(date -u +%Y-%m-%d) (run $GITHUB_RUN_ID)"
          for attempt in 1 2 3; do
            git push origin HEAD:main && { echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            git fetch origin main && git rebase origin/main || { echo "::error::rebase failed"; exit 1; }
          done
          echo "::error::could not push the refresh commit"; exit 1
      - name: Deploy the site
        if: env.DRY_RUN != 'true' && steps.refresh.outputs.rc == '0' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Fail the job if a hard check failed
        if: steps.refresh.outputs.rc != '0'
        run: |
          echo "::error title=Validation failed::Hard checks failed; the previous month's data stays live. See data/validation/report.md."
          exit 1
