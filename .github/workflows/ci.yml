name: CI
# Runs once per pull request: not again on merge (Claude runs `make test` locally before
# merging). Docs-only PRs skip CI. A newer push to the same PR cancels the older run.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"
      - name: Pipeline tests (fast subset, fixtures only, no network)
        run: python -m pytest -q -n 2 -m "not slow" pipeline
      - name: Exported schemas are up to date
        run: |
          mm schema
          git diff --exit-code schemas/ || (echo "::error::Run 'mm schema' and commit schemas/"; exit 1)
      - name: Build registry, health and layers from fixtures
        run: mm build
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web tests and build
        working-directory: web
        run: |
          npm ci
          npm run gen:types
          git diff --exit-code src/generated/ || (echo "::error::Run 'npm run gen:types' and commit src/generated/"; exit 1)
          npm run typecheck
          npm test
          npx vite build
