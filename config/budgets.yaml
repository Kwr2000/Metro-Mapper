# Hard call budgets for live sources. The pipeline fails closed at the limit, and an
# adapter with no entry here cannot run live at all. Spend is computed from
# data/runs/ingestion_runs.jsonl (live runs only), in UTC days and months.
# Changing a budget needs the owner's written approval in docs/DECISIONS.md.
adapters:
  areas: {per_day: 30, min_interval_seconds: 1}
  fema_nfhl: {per_day: 40, min_interval_seconds: 15, max_minutes: 20}
  acs: {per_day: 40, min_interval_seconds: 1}
  schools: {per_day: 10, min_interval_seconds: 1}
  apd: {per_day: 10, min_interval_seconds: 1}
  access: {per_day: 6, min_interval_seconds: 5, max_minutes: 25}
  dps_agency: {per_day: 10, min_interval_seconds: 2}
  elections: {per_day: 4, min_interval_seconds: 5, max_minutes: 15}
  parcels: {per_day: 6, min_interval_seconds: 5, max_minutes: 30}
  fbi_national: {per_day: 4, min_interval_seconds: 2}
  tcad: {per_day: 2, max_minutes: 45}
  wcad: {per_day: 40, min_interval_seconds: 2}
  hays_cad: {per_day: 2}
