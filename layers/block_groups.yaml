id: block_groups
title: Block groups
group: Areas
description: 2020 Census block groups with names chosen by polygon coverage.
source: areas
geometry: polygon
join: block_group
dataset: block_group
publish: geojson
style:
  type: line
  paint:
    line-color: "#454545"
    line-width: 0.7
popup:
  - {field: name, label: Name, annotation_field: boundary_note}
  - {field: name_source, label: Name source}
  - {field: geoid, label: GEOID}
  - {field: county, label: County}
  - {field: area_sq_mi, label: Area (sq mi), format: number}
coverage: study_area
refresh: annual
attribution: U.S. Census Bureau, 2020 TIGER/Line via TIGERweb; City of Austin; Williamson Central Appraisal District; Hays County
license: "Census boundaries and places: public domain. Austin planning areas, City of Austin subdivisions, WCAD subdivisions and Hays County subdivisions: No license stated."
disclaimer: This product is for informational purposes and may not have been prepared for or be suitable for legal, engineering, or surveying purposes.
default_visible: true
order: 10
