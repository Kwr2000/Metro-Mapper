# Shares the apd_block_group bundle with apd_part1_rate and apd_part1_density.
id: apd_violent_rate
title: Reported violent incidents per 1,000 residents (smoothed)
group: Safety
description: 'Violent reports (murder, rape, robbery, aggravated assault) to Austin PD over the last 12
  full months, by the block group APD assigns. Reports are not convictions; only the highest offense per
  report is counted. Rates for small populations are pulled toward the Austin-wide rate. Not specific
  to any street. Outside Austin PD''s area: not available.'
source: apd
geometry: polygon
join: block_group
dataset: block_group
data_bundle: apd_block_group
publish: geojson
style:
  type: fill
  paint:
    fill-opacity: 0.55
    fill-color:
    - case
    - - ==
      - - get
        - rate_violent
      - null
    - '#bdbdbd'
    - - step
      - - get
        - rate_violent
      - '#feedde'
      - 1
      - '#fdbe85'
      - 2.5
      - '#fd8d3c'
      - 5
      - '#e6550d'
      - 10
      - '#a63603'
popup:
- field: rate_violent
  label: Violent rate (smoothed)
  format: number
- field: rate_violent_raw
  label: Violent rate (raw)
  format: number
- field: violent
  label: Violent reports
  format: number
- field: rate_part1
  label: Reported Part I incidents per 1,000 residents (smoothed)
  format: number
- field: rate_part1_raw
  label: Part I rate (raw)
  format: number
- field: density_part1
  label: Reported Part I incidents per square mile
  format: number
- field: property
  label: Property reports
  format: number
- field: other
  label: Other reports
  format: number
- field: total
  label: Total reports
  format: number
- field: population_2020
  label: 2020 Census population
  format: number
- field: period
  label: Report period
- field: safety_note
  label: Note
  hide_if_empty: true
- field: geoid
  label: GEOID
popup_title: Reported violent incidents per 1,000 residents (smoothed)
legend:
- label: Below 1
  color: '#feedde'
- label: 1 to below 2.5
  color: '#fdbe85'
- label: 2.5 to below 5
  color: '#fd8d3c'
- label: 5 to below 10
  color: '#e6550d'
- label: 10 or more
  color: '#a63603'
- label: Not available
  color: '#bdbdbd'
as_of_field: as_of
coverage: study_area
refresh: monthly
attribution: City of Austin, Texas - data.austintexas.gov (APD Crime Reports); U.S. Census Bureau
license: Public domain
default_visible: false
order: 60
compare:
  field: rate_violent
  method: ratio
  breaks:
  - 0.67
  - 0.9
  - 1.1
  - 1.5
  direction: lower_is_better
