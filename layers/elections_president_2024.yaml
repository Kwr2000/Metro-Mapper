  unit: pts
id: elections_president_2024
title: 2024 presidential vote by precinct
group: People
description: 'Official general-election results by voting precinct, from the Texas
  Legislative Council. Texas has no party registration; registered voters include
  everyone registered. Precincts with fewer than 50 votes are not shown. For context
  only: never used in any score or ranking.'
source: elections
geometry: polygon
join: precinct
dataset: precinct
