style:
  type: fill
  paint:
    fill-opacity: 0.55
    fill-color:
    - case
    - - ==
      - - get
        - pres_2024_margin
      - null
    - '#bdbdbd'
    - - step
      - - get
        - pres_2024_margin
      - '#2166ac'
      - -0.4
      - '#67a9cf'
      - -0.2
      - '#d1e5f0'
      - -0.05
      - '#f7f7f7'
      - 0.05
      - '#fddbc7'
      - 0.2
      - '#ef8a62'
      - 0.4
      - '#b2182b'
