id: school_districts
title: School districts
group: Schools
description: School district boundaries and links to each district's school finder or website. District boundaries do not identify a campus serving an address.
source: schools
geometry: polygon
join: jurisdiction
dataset: district
publish: geojson
style:
  type: fill
  paint:
    fill-opacity: 1
    fill-color: "rgba(0,0,0,0)"
    fill-outline-color: "#454545"
popup:
  - {field: name, label: District}
  - {field: grades, label: Grades}
  - {field: finder_link, label: School finder, format: link, annotation_field: finder_label}
  - {field: overall_rating, label: TEA district rating (2024–25)}
  - {field: overall_score, label: Overall score, format: number}
  - {field: student_achievement_rating, label: Student Achievement rating}
  - {field: school_progress_rating, label: School Progress rating}
  - {field: academic_growth_rating, label: Academic Growth rating}
  - {field: closing_the_gaps_rating, label: Closing the Gaps rating}
  - {field: rating_note, label: Rating note, hide_if_empty: true}
  - {field: zone_note, label: Assigned schools}
coverage: study_area
refresh: annual
attribution: U.S. Census Bureau, TIGERweb; Texas Education Agency via data.texas.gov (ratings)
license: Public domain (boundaries); no license stated (TEA ratings)
default_visible: false
order: 300
